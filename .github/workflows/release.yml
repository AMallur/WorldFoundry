name: WorldFoundry release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'publish/v*'

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify version matches release ref
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version" || test "$GITHUB_REF_NAME" = "publish/v$package_version"
          grep -F "__version__ = \"$package_version\"" src/worldfoundry/__init__.py
      - run: python -m pip install '.[dev]' build twine
      - run: python -c 'import worldfoundry, importlib.metadata; assert worldfoundry.__version__ == importlib.metadata.version("worldfoundry")'
      - run: python -m pytest
      - run: node --test tests/*.test.mjs gateway/test.mjs
      - run: ruff check src tests examples
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
