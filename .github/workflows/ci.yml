name: WorldFoundry CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python SDK and test dependencies
        run: python -m pip install '.[dev]'
      - name: Python tests
        run: python -m pytest
      - name: Python lint
        run: ruff check src tests examples
      - name: Gateway and simulation tests
        run: node --test tests/*.test.mjs gateway/test.mjs
      - name: Compile Python sources
        run: python -m compileall -q src tests examples
